<div class="perfil">
    <h2> {{nom}} </h2>
    <p>{{cognom}}</p>
    <p>Edat: {{edat}}</p>
    <p>Cicle: {{cicle}}</p>
    <p>{{ edat >= 18 ? "És major d'edat" : "És menor d'edat" }}</p>
    <p>Any de naixement: {{2026 - edat}}</p>
    <p>{{(nom + ' ' + cognom).toUpperCase()}}</p>
    <p>{{nomComplet}}</p>
    <p>{{inicials}}</p>
    <p>{{generacio}}</p>
</div>
